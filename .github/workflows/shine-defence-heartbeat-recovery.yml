name: Shine Defence Heartbeat Recovery

on:
  workflow_run:
    workflows:
      - Shine Defence Core
      - Shine Defence On-Demand Executor Readiness
      - Shine Defence Artefact Re-attestation
      - Shine Defence Provider Collector
      - Shine Defence Release Source Registry
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: shine-defence-heartbeat-recovery
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'schedule' ||
       github.event.workflow_run.event == 'workflow_dispatch' ||
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      actions: write
    steps:
      # github.sha is the default-branch commit for workflow_run, never the source PR.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Request bounded signed authority refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node security/shine-defence/integration-kit/authority-heartbeat-recovery-v1.mjs
