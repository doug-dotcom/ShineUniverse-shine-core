name: Shine Foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  foundation-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node foundation/integration-kit/verify-object-registry-v1.mjs
      - run: node --test foundation/integration-kit/permission-engine-v1.test.mjs
      - run: node --test foundation/gateway/gateway-core-v1.test.mjs foundation/gateway/defence-status-v1.test.mjs foundation/gateway/http-handler-v1.test.mjs foundation/gateway/identity-claim-v1.test.mjs foundation/gateway/grant-consent-v1.test.mjs foundation/gateway/grant-revocation-v1.test.mjs foundation/gateway/revocation-feed-v1.test.mjs foundation/gateway/revocation-ack-v1.test.mjs foundation/gateway/revocation-health-v1.test.mjs foundation/gateway/integration-delegation-refresh-v1.test.mjs
      - run: node --test foundation/runtime/supabase-runtime-adapters-v1.test.mjs
      - run: node --test foundation/onboarding/connection-spec-v1.test.mjs foundation/onboarding/foundation-app-client-v1.test.mjs foundation/onboarding/identity-claim-client-v1.test.mjs foundation/onboarding/grant-consent-client-v1.test.mjs
      - run: node foundation/onboarding/verify-examples-v1.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check foundation/runtime/edge-function/index.ts

  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Bootstrap Supabase-compatible roles
        run: psql -v ON_ERROR_STOP=1 -f foundation/postgres/test-bootstrap.sql
      - name: Apply Foundation persistence schema
        run: psql -v ON_ERROR_STOP=1 -f foundation/postgres/persistence-v1.sql
      - name: Apply Foundation runtime schema
        run: psql -v ON_ERROR_STOP=1 -f foundation/postgres/runtime-v1.sql
      - name: Apply identity federation
        run: psql -v ON_ERROR_STOP=1 -f foundation/postgres/identity-federation-v1.sql
      - name: Apply app connection registry
        run: psql -v ON_ERROR_STOP=1 -f foundation/postgres/app-connection-registry-v1.sql
      - name: Apply identity federation v2
        run: psql -v ON_ERROR_STOP=1 -f foundation/postgres/identity-federation-v2.sql
      - name: Apply identity claim v1
        run: psql -v ON_ERROR_STOP=1 -f foundation/postgres/identity-claim-v1.sql
      - name: Apply explicit Vault grant consent
        run: psql -v ON_ERROR_STOP=1 -f foundation/postgres/grant-consent-v1.sql
      - name: Apply explicit Vault grant revocation
        run: psql -v ON_ERROR_STOP=1 -f foundation/postgres/grant-revocation-v1.sql
      - name: Apply app revocation feed
        run: psql -v ON_ERROR_STOP=1 -f foundation/postgres/app-revocation-feed-v1.sql
      - name: Apply revocation acknowledgement checkpoint
        run: psql -v ON_ERROR_STOP=1 -f foundation/postgres/revocation-ack-checkpoint-v1.sql
      - name: Apply revocation delivery receipts
        run: psql -v ON_ERROR_STOP=1 -f foundation/postgres/revocation-delivery-receipts-v1.sql
      - name: Apply revocation freshness policy
        run: psql -v ON_ERROR_STOP=1 -f foundation/postgres/revocation-freshness-policy-v1.sql
      - name: Apply advisor FK indexes
        run: psql -v ON_ERROR_STOP=1 -f foundation/postgres/advisor-fk-indexes-v1.sql
      - name: Apply hosted-advisor hardening
        run: psql -v ON_ERROR_STOP=1 -f foundation/postgres/live-advisor-hardening-v1.sql
      - name: Run persistence acceptance tests
        run: psql -v ON_ERROR_STOP=1 -f foundation/postgres/persistence-v1.test.sql
      - name: Run runtime acceptance tests
        run: psql -v ON_ERROR_STOP=1 -f foundation/postgres/runtime-v1.test.sql
      - name: Run identity federation acceptance tests
        run: psql -v ON_ERROR_STOP=1 -f foundation/postgres/identity-federation-v1.test.sql
      - name: Run app connection registry acceptance tests
        run: psql -v ON_ERROR_STOP=1 -f foundation/postgres/app-connection-registry-v1.test.sql
      - name: Run identity federation v2 acceptance tests
        run: psql -v ON_ERROR_STOP=1 -f foundation/postgres/identity-federation-v2.test.sql
      - name: Run identity claim acceptance tests
        run: psql -v ON_ERROR_STOP=1 -f foundation/postgres/identity-claim-v1.test.sql
      - name: Run explicit Vault grant consent acceptance tests
        run: psql -v ON_ERROR_STOP=1 -f foundation/postgres/grant-consent-v1.test.sql
      - name: Run explicit Vault grant revocation acceptance tests
        run: psql -v ON_ERROR_STOP=1 -f foundation/postgres/grant-revocation-v1.test.sql
      - name: Run revocation propagation acceptance tests
        run: psql -v ON_ERROR_STOP=1 -f foundation/postgres/revocation-propagation-v1.test.sql
