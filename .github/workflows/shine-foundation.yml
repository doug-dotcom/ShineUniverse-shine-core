name: Shine Foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  object-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node foundation/integration-kit/verify-object-registry-v1.mjs
