name: Shine Defence Release Source Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shine-defence-release-head.yml'
      - 'security/shine-defence/release-source-watch-v1.json'
      - 'foundation/runtime/defence-release-head-ingest/index.ts'
      - 'foundation/postgres/defence-release-source-head-v1.sql'
      - 'foundation/postgres/defence-release-source-head-v1.test.sql'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Validate distributed release source registry
        run: |
          node <<'NODE'
          const fs=require('fs');
          const config=JSON.parse(fs.readFileSync('security/shine-defence/release-source-watch-v1.json','utf8'));
          if(config.contract!=='shine-defence/release-source-watch-v1'||config.schemaVersion!=='1.1.0'||!Array.isArray(config.sources)){
            throw new Error('invalid release source watch config');
          }
          if(config.sources.length!==14) throw new Error('expected 14 release source targets');
          const targets=new Set();
          const repos=new Set();
          const repoIds=new Set();
          for(const source of config.sources){
            if(!/^railway:[a-z0-9][a-z0-9-]*$/.test(source.targetId)) throw new Error('invalid targetId');
            if(!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(source.repository)) throw new Error('invalid repository');
            if(typeof source.branch!=='string'||!source.branch||/[\r\n]/.test(source.branch)) throw new Error('invalid branch');
            if(!/^[0-9]{1,20}$/.test(String(source.repositoryId||''))) throw new Error('invalid repositoryId');
            if(source.repositoryOwner!=='doug-dotcom') throw new Error('invalid repositoryOwner');
            if(String(source.repositoryOwnerId)!=='225530237') throw new Error('invalid repositoryOwnerId');
            if(targets.has(source.targetId)) throw new Error('duplicate targetId');
            if(repos.has(source.repository.toLowerCase())) throw new Error('duplicate repository');
            if(repoIds.has(String(source.repositoryId))) throw new Error('duplicate repositoryId');
            targets.add(source.targetId);
            repos.add(source.repository.toLowerCase());
            repoIds.add(String(source.repositoryId));
          }
          console.log('Distributed release source registry: PASS',config.sources.length,'targets');
          NODE
