name: Shine Defence Core
run-name: "Defence • ${{ inputs.orchestration_id || github.sha }}"
on:
  workflow_dispatch:
    inputs:
      orchestration_id:
        description: Shine Universe orchestration ID
        required: false
        type: string
      pass:
        description: Shine Universe pass number
        required: false
        type: string
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node security/shine-defence/integration-kit/verify-registry-v1.mjs
      - run: node --test foundation/runtime/_shared/github-actions-oidc-v1.test.mjs
      - run: node security/shine-defence/integration-kit/attestation-workflow-compatibility-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/foundation-runtime-inspector-v1.mjs --json
      - run: node security/shine-defence/integration-kit/reattest-foundation-runtime-v1.mjs --repo-root . --output /tmp/reattest.json --report-output /tmp/reattest-report.json --service foundation.gateway --environment production --artifact aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --source-commit ${{ github.sha }} --policy-commit ${{ github.sha }}
      - run: node security/shine-defence/integration-kit/estate-provider-collector-v1.mjs --validate-only
      - run: node security/shine-defence/integration-kit/estate-provider-collector-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/verify-ecosystem-ledger-v1.mjs
      - run: node security/shine-defence/integration-kit/verify-revocations-v1.mjs
      - run: node security/shine-defence/integration-kit/assess-release-claim-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/verify-certification-receipts-v1.mjs
      - run: node security/shine-defence/integration-kit/evaluate-release-status-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/consumer-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/verify-review-candidates-v1.mjs
      - run: node security/shine-defence/integration-kit/verify-review-decisions-v1.mjs
      - run: node security/shine-defence/integration-kit/promote-review-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/onboard-review-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/intake-review-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/supersede-candidate-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/generate-review-checklist-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/review-evidence-assistant-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/review-workspace-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/review-queue-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/finalize-rejection-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/verify-review-rejections-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/review-queue-v1.mjs --json
      - run: node security/shine-defence/integration-kit/deployment-observations-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/collect-deployment-observations-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/verify-deployment-sources-v1.mjs
      - run: node security/shine-defence/integration-kit/deployment-coverage-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/deployment-coverage-v1.mjs --json
      - run: node security/shine-defence/integration-kit/plan-review-intake-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/generate-review-evidence-pack-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/human-diff-review-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/human-review-event-ledger-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/human-review-event-ledger-v1.mjs
      - run: node security/shine-defence/integration-kit/review-integrity-checkpoint-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/review-integrity-checkpoint-v1.mjs
      - run: node security/shine-defence/integration-kit/review-session-summary-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/review-session-summary-v1.mjs
      - run: node security/shine-defence/integration-kit/candidate-intake-readiness-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/candidate-intake-readiness-v1.mjs
      - run: node security/shine-defence/integration-kit/plan-review-intake-v1.mjs --json
      - run: node security/shine-defence/integration-kit/record-deployment-observation-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/deployment-observations-v1.mjs --json
      - run: node security/shine-defence/integration-kit/operations-controller-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/operations-controller-v1.mjs --json
      - run: node security/shine-defence/integration-kit/staleness-visibility-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/command-centre-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/command-centre-v1.mjs --json
      - run: node security/shine-defence/integration-kit/attention-queue-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/attention-queue-v1.mjs --json
      - run: node security/shine-defence/integration-kit/audit-export-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/audit-export-v1.mjs --app shine-translate --as-of 2026-09-27T07:00:00.000Z
      - run: node security/shine-defence/integration-kit/estate-audit-manifest-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/estate-audit-manifest-v1.mjs --as-of 2026-09-27T08:00:00.000Z
      - run: node security/shine-defence/integration-kit/estate-manifest-diff-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/estate-audit-timeline-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/timeline-snapshot-planner-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/timeline-snapshot-planner-v1.mjs --as-of 2026-09-27T08:10:00.000Z
      - run: node security/shine-defence/integration-kit/estate-audit-timeline-v1.mjs --as-of 2026-09-27T09:00:00.000Z
      - run: node security/shine-defence/integration-kit/verify-review-checklists-v1.mjs
      - run: node security/shine-defence/integration-kit/verify-review-evidence-suggestions-v1.mjs
      - run: node security/shine-defence/integration-kit/verify-review-rejections-v1.mjs
      - run: node security/shine-defence/integration-kit/verify-review-promotions-v1.mjs --self-test
      - run: node security/shine-defence/integration-kit/verify-review-promotions-v1.mjs
