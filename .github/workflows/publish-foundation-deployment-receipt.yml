name: Publish Foundation Deployment Receipt

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-foundation-deployment-receipt.yml'
      - 'foundation/deployments/current-foundation-gateway-provider-receipt.json'
      - 'foundation/runtime/deployment-receipt-ingest/index.ts'
      - 'foundation/contracts/deployment-receipt-publisher-v1.json'

permissions:
  contents: read
  id-token: write

concurrency:
  group: foundation-deployment-receipt
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate deployment receipt manifest
        run: |
          node <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('foundation/deployments/current-foundation-gateway-provider-receipt.json','utf8'));
          if(body.contract!=='shine-foundation/deployment-receipt-publish-v1'||body.schemaVersion!=='1.0.0'){
            throw new Error('invalid deployment receipt contract');
          }
          const r=body.receipt||{};
          if(!/^\d+$/.test(String(r.runtimeVersion||''))) throw new Error('invalid runtimeVersion');
          if(!/^[a-f0-9]{64}$/i.test(String(r.artifactSha256||''))) throw new Error('invalid artifactSha256');
          if(!/^[a-f0-9]{40}$/i.test(String(r.sourceCommit||''))) throw new Error('invalid sourceCommit');
          if(!['active','inactive','failed'].includes(r.runtimeState)) throw new Error('invalid runtimeState');
          if(typeof r.providerEvidenceRef!=='string'||!r.providerEvidenceRef) throw new Error('missing providerEvidenceRef');
          if(Number.isNaN(Date.parse(r.providerObservedAt))) throw new Error('invalid providerObservedAt');
          if(typeof r.rollback!=='boolean') throw new Error('invalid rollback');
          require('child_process').execFileSync('git',['cat-file','-e',r.sourceCommit+'^{commit}']);
          const exact=require('child_process').execFileSync('git',['rev-parse',r.sourceCommit+'^{commit}'],{encoding:'utf8'}).trim();
          if(exact!==r.sourceCommit) throw new Error('sourceCommit is not exact');
          console.log(JSON.stringify({
            runtimeVersion:r.runtimeVersion,
            artifactSha256:r.artifactSha256,
            sourceCommit:r.sourceCommit,
            providerEvidenceRef:r.providerEvidenceRef,
            providerObservedAt:r.providerObservedAt,
            rollback:r.rollback
          },null,2));
          NODE

      - name: Acquire GitHub OIDC token
        run: |
          OIDC_JSON="$(curl -fsSL             -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=shine-foundation-deployment-receipt")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$OIDC_TOKEN"
          printf '%s' "$OIDC_TOKEN" > "$RUNNER_TEMP/foundation-deployment-receipt-oidc"

      - name: Publish deployment receipt
        run: |
          OIDC_TOKEN="$(cat "$RUNNER_TEMP/foundation-deployment-receipt-oidc")"
          curl --fail-with-body --silent --show-error             --request POST             --url "https://sjpxqeyewahraxvidvcc.supabase.co/functions/v1/foundation-deployment-receipt-ingest"             --header "Authorization: Bearer $OIDC_TOKEN"             --header "Content-Type: application/json"             --data-binary @foundation/deployments/current-foundation-gateway-provider-receipt.json             > "$RUNNER_TEMP/foundation-deployment-receipt-response.json"

          node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/foundation-deployment-receipt-response.json','utf8'));
          if(r.status!=='accepted') throw new Error('receipt ingest rejected: '+JSON.stringify(r));
          const receiptStatus=r.receipt?.status;
          if(!['reconciled','replayed'].includes(receiptStatus)){
            throw new Error('unexpected receipt status: '+JSON.stringify(r));
          }
          const state=r.reconciliation?.state;
          if(['unknown','drift'].includes(state)){
            throw new Error('deployment reconciliation unsafe: '+JSON.stringify(r.reconciliation));
          }
          console.log(JSON.stringify({
            ingestStatus:r.status,
            receiptStatus,
            receiptId:r.receipt?.receiptId??null,
            runtimeVersion:r.receipt?.runtimeVersion??null,
            reconciliationState:state??null,
            readinessState:r.reconciliation?.readiness?.readinessState??null
          },null,2));
          NODE
