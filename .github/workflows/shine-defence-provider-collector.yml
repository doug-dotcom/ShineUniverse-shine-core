name: Shine Defence Provider Collector

on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shine-defence-provider-collector.yml'
      - 'security/shine-defence/estate-provider-sources-v1.json'
      - 'security/shine-defence/integration-kit/estate-provider-collector-v1.mjs'
      - 'foundation/runtime/defence-provider-ingest/index.ts'

permissions:
  contents: read
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate provider source registry
        run: node security/shine-defence/integration-kit/estate-provider-collector-v1.mjs --validate-only

      - name: Run provider collector self-test
        run: node security/shine-defence/integration-kit/estate-provider-collector-v1.mjs --self-test

      - name: Collect provider evidence
        id: collect
        env:
          SHINE_DEFENCE_RAILWAY_WORKSPACE_TOKEN: ${{ secrets.SHINE_DEFENCE_RAILWAY_WORKSPACE_TOKEN }}
          SHINE_DEFENCE_SUPABASE_READ_TOKEN: ${{ secrets.SHINE_DEFENCE_SUPABASE_READ_TOKEN }}
        run: |
          node security/shine-defence/integration-kit/estate-provider-collector-v1.mjs --output provider-snapshot.json
          COUNT="$(node -e "const x=require('./provider-snapshot.json');process.stdout.write(String(x.observations.length))")"
          RAILWAY="$(node -e "const x=require('./provider-snapshot.json');process.stdout.write(x.providerStatus.railway)")"
          SUPABASE="$(node -e "const x=require('./provider-snapshot.json');process.stdout.write(x.providerStatus.supabase)")"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Railway collector credential: $RAILWAY"
          echo "Supabase collector credential: $SUPABASE"
          echo "Collected provider observations: $COUNT"

      - name: Acquire GitHub OIDC token
        id: oidc
        run: |
          OIDC_JSON="$(curl -fsSL             -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=shine-defence-provider-ingest")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$OIDC_TOKEN"
          printf '%s' "$OIDC_TOKEN" > /tmp/shine-defence-oidc-token

      - name: Ingest provider evidence into Foundation
        run: |
          OIDC_TOKEN="$(cat /tmp/shine-defence-oidc-token)"
          HTTP_STATUS="$(curl -sS             -o /tmp/provider-ingest-response.json             -w '%{http_code}'             -X POST             -H "Authorization: Bearer $OIDC_TOKEN"             -H "Content-Type: application/json"             --data-binary @provider-snapshot.json             https://sjpxqeyewahraxvidvcc.supabase.co/functions/v1/defence-provider-ingest)"
          if [ "$HTTP_STATUS" != "200" ]; then
            cat /tmp/provider-ingest-response.json
            exit 1
          fi
          node -e "
            const fs=require('fs');
            const snapshot=JSON.parse(fs.readFileSync('provider-snapshot.json','utf8'));
            const response=JSON.parse(fs.readFileSync('/tmp/provider-ingest-response.json','utf8'));
            if(response.status!=='accepted'||response.accepted!==snapshot.observations.length){
              throw new Error('provider ingest acceptance count mismatch');
            }
            console.log('Provider ingest accepted:',response.accepted);
          "

      - name: Report credential-pending providers
        if: steps.collect.outputs.count == '0'
        run: |
          echo "OIDC ingest proof succeeded with zero provider observations."
          echo "Configure SHINE_DEFENCE_RAILWAY_WORKSPACE_TOKEN and/or SHINE_DEFENCE_SUPABASE_READ_TOKEN."
          echo "No freshness is manufactured; estate Sentinel will warn when existing provider evidence expires."

      - name: Summarise provider evidence coverage
        if: always() && steps.collect.outcome == 'success'
        run: |
          node <<'NODE'
          const fs = require('fs');
          const snapshot = JSON.parse(fs.readFileSync('provider-snapshot.json', 'utf8'));
          const responsePath = '/tmp/provider-ingest-response.json';
          let accepted = 'unverified';
          if (fs.existsSync(responsePath)) {
            try {
              const response = JSON.parse(fs.readFileSync(responsePath, 'utf8'));
              if (response.status === 'accepted' && Number.isInteger(response.accepted)) accepted = response.accepted;
            } catch {}
          }
          const count = snapshot.observations.length;
          const pending = Object.values(snapshot.providerStatus).some(status => status !== 'configured');
          const state = pending ? 'Credential pending — provider coverage incomplete' : (count === 0 ? 'No provider evidence collected' : 'Provider evidence collected');
          const lines = [
            '## Shine Defence provider evidence',
            '',
            '**' + state + '**',
            '',
            '| Check | Result |',
            '| --- | --- |',
            '| Railway credential | ' + snapshot.providerStatus.railway + ' |',
            '| Supabase credential | ' + snapshot.providerStatus.supabase + ' |',
            '| Observations collected | ' + count + ' |',
            '| Observations accepted | ' + accepted + ' |',
            '',
            'A successful workflow does not establish full provider coverage or estate certification.',
            'Zero observations do not refresh any target. Verify target evidence and freshness in Foundation.',
            ''
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'));
          NODE
